<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf6" />
    <meta name="application-name" content="MarkGleam" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="MarkGleam 把 Markdown、代码、Mermaid 和 LaTeX 做成可分享的图片或 PDF。内容在浏览器本地处理，无需登录；免费导出包含简洁品牌署名。"
    />
    <link rel="canonical" href="https://markgleam.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:site_name" content="MarkGleam" />
    <meta property="og:title" content="MarkGleam：把结构化内容做成视觉作品" />
    <meta
      property="og:description"
      content="在一个本地工作台中处理 Markdown、代码、图表和公式，再导出图片或 PDF。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://markgleam.com/" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:image" content="https://markgleam.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MarkGleam 结构化内容视觉工作台界面" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarkGleam：把结构化内容做成视觉作品" />
    <meta
      name="twitter:description"
      content="在浏览器本地处理 Markdown、代码、图表和公式，再导出图片或 PDF。"
    />
    <meta name="twitter:image" content="https://markgleam.com/og.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MarkGleam",
        "alternateName": "墨光",
        "url": "https://markgleam.com/",
        "description": "把 Markdown、代码、Mermaid 和 LaTeX 做成可分享的图片或 PDF。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern web browser",
        "inLanguage": ["zh-CN", "en"],
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "CNY"
        },
        "featureList": [
          "Markdown、代码、Mermaid 与 LaTeX 输入",
          "PNG、JPEG、WebP、SVG 和 PDF 导出",
          "浏览器本地处理，无需登录",
          "免费导出包含简洁品牌署名"
        ]
      }
    </script>
    <style>
      .app-bootstrap {
        min-height: 100vh;
        background: #f4f1e9;
        color: #292722;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      .app-bootstrap__bar {
        display: flex;
        align-items: center;
        height: 56px;
        padding: 0 20px;
        border-bottom: 1px solid #ded8ca;
        background: #fbfaf6;
      }
      .app-bootstrap__brand {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .app-bootstrap__brand span {
        margin-left: 10px;
        color: #777166;
        font-size: 13px;
        font-weight: 500;
      }
      .app-bootstrap__main {
        display: grid;
        min-height: calc(100vh - 56px);
        place-items: center;
        padding: 32px 20px;
      }
      .app-bootstrap__copy {
        max-width: 620px;
        text-align: center;
      }
      .app-bootstrap__copy p {
        margin: 12px 0 0;
        color: #6e685d;
        line-height: 1.7;
      }
    </style>
    <title>MarkGleam：Markdown、代码与图表转图片</title>
  </head>
  <body>
    <div id="root">
      <div class="app-bootstrap">
        <header class="app-bootstrap__bar">
          <p class="app-bootstrap__brand">
            MarkGleam <span>本地处理 · 免费使用</span>
          </p>
        </header>
        <main class="app-bootstrap__main">
          <div class="app-bootstrap__copy">
            <h1>把结构化内容做成可分享的视觉作品</h1>
            <p>
              在一个工作台中编辑 Markdown、代码、Mermaid 和 LaTeX，再导出
              PNG、WebP、SVG 或 PDF。
            </p>
          </div>
        </main>
      </div>
    </div>
    <noscript>MarkGleam 需要启用 JavaScript，文档与导出处理都在你的浏览器本地完成。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
